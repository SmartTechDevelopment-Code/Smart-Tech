<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QuickStitch HTML</title>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QuickStitch" />

    <link rel="manifest" href="favicon/site.webmanifest" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Monaco Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter"], mono: ["ui-monospace"] },
            colors: { primary: "#6366f1" },
          },
        },
      };
    </script>

    <style>
      @keyframes loader {
        from {
          transform: scale(1) rotateY(0) rotateX(0) rotateZ(0);
        }
        to {
          transform: scale(2) rotateY(180deg) rotateX(180deg) rotateZ(180deg);
        }
      }
      #loaderOverlay {
        background: #111827;
        transition: opacity 0.4s;
      }
      .ring {
        position: absolute;
        width: 3.5rem;
        height: 3.5rem;
        border: 5px solid #fff;
        border-radius: 50%;
        animation: loader 1.5s infinite alternate cubic-bezier(1, 0, 0, 1);
      }
      .ring:nth-child(2) {
        animation-delay: 0.25s;
      }
      .ring:nth-child(3) {
        animation-delay: 0.5s;
      }
    </style>
    <style>
      @layer utilities {
        .monaco-editor,
        .monaco-editor .overflow-guard {
          z-index: 0 !important;
        }
        .monaco-editor .suggest-widget,
        .monaco-editor .monaco-hover,
        .monaco-editor .context-view {
          z-index: 50 !important;
        }
      }
    </style>
  </head>

  <body class="min-h-screen flex flex-col bg-gray-900 text-gray-100 dark:bg-white dark:text-gray-900">
    <div
      id="previewModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-[9999]"
    >
      <div class="bg-white text-black p-6 rounded-xl w-80">
        <h2 class="text-xl font-semibold mb-3">Preview Notice</h2>
        <p class="mb-4">Your preview will open in a new tab and stay active for 1 minute.</p>
        <button id="continuePreview" class="px-4 py-2 bg-primary text-white rounded-md">Continue</button>
      </div>
    </div>

    <!-- LOADER -->
    <div id="loaderOverlay" class="fixed inset-0 flex items-center justify-center z-50">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>

    <!-- HEADER -->
    <header class="p-6 border-b border-gray-800 dark:border-gray-300 flex items-center">
      <img src="quickstitch.svg" alt="Logo" width="100" class="mr-5 rounded-2xl"/>
      <div>
        <h1 class="text-3xl font-semibold text-primary">QuickStitch HTML</h1>
        <p class="text-gray-400 dark:text-gray-600">Live HTML preview with Monaco Editor</p>
      </div>
      <button
        id="themeToggle"
        class="ml-auto px-3 py-1.5 bg-gray-700 dark:bg-gray-200 text-gray-200 dark:text-gray-900 rounded-md text-sm"
      >
        Toggle Theme
      </button>
    </header>

    <!-- MAIN GRID -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 p-6 h-[calc(100vh-96px)] min-h-0">
      <!-- INPUT PANEL -->
      <div
        class="flex flex-col h-full min-h-0 bg-gray-800 dark:bg-gray-100 rounded-xl border border-gray-700 dark:border-gray-300"
      >
        <div class="flex items-center p-4 border-b border-gray-700 dark:border-gray-300">
          <h2 class="text-xl font-medium">Input</h2>
          <span class="px-5">
            (<input
              id="nameInput"
              class="h-5 w-24 bg-gray-900 dark:bg-gray-200 dark:text-gray-900"
              placeholder="file"
            />.html)
          </span>
          <button id="downloadBtn" class="ml-auto px-3 py-1.5 bg-primary text-white rounded-md text-sm">
            Download
          </button>
        </div>
        <div id="editor" class="flex-1 min-h-0 bg-gray-900 dark:bg-gray-200 rounded-b-xl"></div>
      </div>

      <!-- OUTPUT PANEL -->
      <div
        class="flex flex-col h-full min-h-0 bg-gray-800 dark:bg-gray-100 rounded-xl border border-gray-700 dark:border-gray-300"
      >
        <div class="flex items-center p-4 border-b border-gray-700 dark:border-gray-300">
          <h2 class="text-xl font-medium">Output</h2>
          <span id="outputTitle" class="ml-3 text-gray-400 dark:text-gray-600"></span>
          <button id="fullscreenBtn" class="ml-auto px-3 py-1.5 bg-primary text-white rounded-md text-sm">
            Fullscreen
          </button>
          <button id="newTabBtn" class="ml-5 px-3 py-1.5 bg-primary text-white rounded-md text-sm">
            Tab Preview
          </button>
        </div>
        <iframe
          id="outputFrame"
          class="flex-1 min-h-0 bg-white dark:bg-gray-200 rounded-b-xl"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
      </div>
    </div>

    <script>
      /* ---------------- LOADER ---------------- */
      const MIN_TIME = 1500;
      const startTime = Date.now();

      window.addEventListener("load", () => {
        const overlay = document.getElementById("loaderOverlay");
        const remaining = Math.max(0, MIN_TIME - (Date.now() - startTime));
        setTimeout(() => {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 400);
        }, remaining);

        const originalStyles = new Map();

        window.addEventListener("DOMContentLoaded", () => {
          document.querySelectorAll("*").forEach((el) => {
            originalStyles.set(el, el.getAttribute("style"));
          });
        });
      });

      /* ---------------- MONACO ---------------- */
      const defaultDoc = `<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Title</title>
    <style></style>
  </head>
  <body>
    <!-- Your content goes here -->
    <h1>Hello, World!</h1>
    <p>This is a basic paragraph in the body of the page.</p>
  </body>
</html>
`;
      const previewIframe = document.getElementById("outputFrame");
      const saved = localStorage.getItem("currentCode");

      require.config({
        paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" },
      });

      require(["vs/editor/editor.main"], () => {
        window.monacoEditor = monaco.editor.create(document.getElementById("editor"), {
          value: saved || defaultDoc,
          language: "html",
          theme: "vs-dark",
          automaticLayout: true,
          minimap: { enabled: false },
        });

        monacoEditor.onDidChangeModelContent(() => {
          updatePreview();
          updateTitle();
        });

        updatePreview();
        updateTitle();
      });

      function updatePreview() {
        previewIframe.srcdoc = monacoEditor.getValue();
      }

      function updateTitle() {
        const match = monacoEditor.getValue().match(/<title>(.*?)<\/title>/i);
        document.getElementById("outputTitle").textContent = match ? `(${match[1]})` : "";
      }

      window.addEventListener("beforeunload", () => {
        localStorage.setItem("currentCode", monacoEditor.getValue());
      });

      /* ---------------- DOWNLOAD ---------------- */
      document.getElementById("downloadBtn").onclick = () => {
        const blob = new Blob([monacoEditor.getValue()], { type: "text/html" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${document.getElementById("nameInput").value || "document"}.html`;
        a.click();
        URL.revokeObjectURL(a.href);
      };

      /* ---------------- OPEN IN NEW ---------------- */
      document.getElementById("newTabBtn").onclick = () => {
        document.getElementById("previewModal").classList.remove("hidden");
      };

      document.getElementById("continuePreview").onclick = () => {
        const blob = new Blob([monacoEditor.getValue()], { type: "text/html" });
        const url = URL.createObjectURL(blob);

        const win = window.open(url, "_blank");

        setTimeout(() => URL.revokeObjectURL(url), 60000);

        document.getElementById("previewModal").classList.add("hidden");
      };

      /* ---------------- THEME TOGGLE ---------------- */
      document.getElementById("themeToggle").onclick = () => {
        const isDark = document.documentElement.classList.toggle("dark");
        monaco.editor.setTheme(isDark ? "vs-light" : "vs-dark");
      };

      /* ---------------- FULLSCREEN ---------------- */
      document.getElementById("fullscreenBtn").onclick = () => {
        const iframe = document.getElementById("outputFrame");
        (iframe.requestFullscreen || iframe.webkitRequestFullscreen || iframe.msRequestFullscreen).call(iframe);
      };

      document.addEventListener("fullscreenchange", () => {
        const iframe = document.getElementById("outputFrame");

        if (document.fullscreenElement === iframe) {
          iframe.style.height = "100vh";
        } else {
          iframe.style.height = "";
        }
      });
    </script>
  </body>
</html>
